<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gang gang bitch</title>
    <link rel="icon" type="image/png" href="images/Strawhat.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 class="site-title">Nico's Site</h1>
    <p class="site-subtitle">You want that power, don't you, Sasuke</p>
    <hr class="site-divider">

    <main id="feed"></main>

    <script src="posts.js"></script>
    <script>
      (function renderFeed() {
        const feed = document.getElementById("feed");
        const frag = document.createDocumentFragment();

        for (const post of [...posts].reverse()) {
          const wrap = document.createElement("div");
          wrap.className = "post";

          let media;
          if (post.type === "image") {
            media = document.createElement("img");
            media.src = post.src;
            media.alt = post.caption;
            media.loading = "lazy";
          } else {
            media = document.createElement("video");
            media.src = post.src;
            media.controls = true;
            media.preload = "metadata";
          }
          media.className = "post__media";
          if (post.style) media.style.cssText = post.style;

          const capWrap = document.createElement("div");
          capWrap.className = "post__caption-wrap";
          const cap = document.createElement("p");
          cap.className = "post__caption";
          cap.textContent = post.caption;
          capWrap.appendChild(cap);

          wrap.appendChild(media);
          wrap.appendChild(capWrap);
          frag.appendChild(wrap);
        }

        feed.appendChild(frag);
      })();
    </script>
  </body>
</html>
